<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мастер Корней — Игра-тренажёр</title>
    <style>
        :root {
            --primary: #5b4bff;
            --primary-dark: #4338ca;
            --primary-soft: #eef2ff;
            --accent: #f59e0b;
            --accent-soft: #fef3c7;
            --secondary: #ec4899;
            --success: #10b981;
            --success-soft: #d1fae5;
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-soft: #fee2e2;
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --text-dark: #0f172a;
            --text-mid: #334155;
            --text-light: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
            --shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 20px 40px -12px rgba(91, 75, 255, 0.25);
            --radius: 18px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Harmonious font stacks — no external fonts */
        html {
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
            font-feature-settings: 'kern' 1, 'liga' 1;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background:
                radial-gradient(1200px 600px at 10% -10%, #e0e7ff 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 10%, #fce7f3 0%, transparent 55%),
                linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            color: var(--text-dark);
        }

        #app {
            width: 100%;
            max-width: 820px;
            background: var(--bg-card);
            border-radius: 28px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            min-height: 620px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        /* Header */
        .game-header {
            background: linear-gradient(135deg, var(--primary) 0%, #7c3aed 55%, var(--secondary) 100%);
            color: white;
            padding: 22px 24px 20px;
            position: relative;
            overflow: hidden;
        }

        .game-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(400px 200px at 80% 0%, rgba(255,255,255,0.18), transparent 60%),
                radial-gradient(300px 180px at 0% 100%, rgba(255,255,255,0.12), transparent 60%);
            pointer-events: none;
        }

        .game-header h1 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        .game-header .subtitle {
            font-size: 0.92rem;
            opacity: 0.92;
            font-weight: 500;
            position: relative;
        }

        .progress-container {
            background: rgba(255,255,255,0.22);
            height: 8px;
            border-radius: 999px;
            margin-top: 16px;
            overflow: hidden;
            position: relative;
            backdrop-filter: blur(4px);
        }

        .progress-bar {
            background: linear-gradient(90deg, #fde68a, #fbbf24);
            height: 100%;
            transition: width 0.6s cubic-bezier(.2,.9,.3,1);
            border-radius: 999px;
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.88rem;
            font-weight: 600;
            position: relative;
            letter-spacing: 0.01em;
        }

        .stats-bar .stat-pill {
            background: rgba(255,255,255,0.18);
            padding: 6px 12px;
            border-radius: 999px;
            backdrop-filter: blur(4px);
        }

        /* Main Content */
        .game-content {
            flex: 1;
            padding: 28px 22px;
            display: flex;
            flex-direction: column;
        }

        /* Start Screen */
        .start-screen {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .logo-mark {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 84px;
            height: 84px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 2.4rem;
            font-weight: 800;
            margin-bottom: 14px;
            box-shadow: 0 12px 30px -8px rgba(91, 75, 255, 0.5);
            font-family: 'Georgia', 'Cambria', serif;
            letter-spacing: -0.04em;
        }

        .start-screen h2 {
            font-size: 1.7rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            letter-spacing: -0.02em;
            font-weight: 800;
        }

        .start-screen .lead {
            color: var(--text-light);
            margin-bottom: 22px;
            line-height: 1.55;
            font-size: 1rem;
            max-width: 520px;
            margin-left: auto;
            margin-right: auto;
        }

        .mission-list {
            background: linear-gradient(180deg, #ffffff 0%, #fafbff 100%);
            border-radius: var(--radius);
            padding: 22px;
            margin: 18px auto;
            box-shadow: var(--shadow);
            text-align: left;
            border: 1px solid var(--border);
            max-width: 560px;
        }

        .mission-list h3 {
            color: var(--primary);
            margin-bottom: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .mission-list ul {
            list-style: none;
            color: var(--text-mid);
            display: grid;
            gap: 8px;
        }

        .mission-list li {
            padding: 8px 10px 8px 34px;
            position: relative;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .mission-list li:hover {
            background: var(--primary-soft);
        }

        .mission-list li::before {
            content: "✓";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--success-soft);
            color: var(--success);
            font-weight: 800;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 18px auto;
            max-width: 560px;
        }

        .info-card {
            background: var(--bg);
            padding: 14px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .info-card .info-icon {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .info-card .info-label {
            font-size: 0.78rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .info-card .info-value {
            font-size: 0.95rem;
            color: var(--text-dark);
            font-weight: 700;
            margin-top: 2px;
        }

        /* Question Card */
        .question-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 26px 22px;
            box-shadow: var(--shadow);
            animation: slideIn 0.4s cubic-bezier(.2,.9,.3,1);
            border: 1px solid var(--border);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px dashed var(--border);
            gap: 10px;
            flex-wrap: wrap;
        }

        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .points-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--accent-soft);
            color: #92400e;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 700;
        }

        .timer {
            background: linear-gradient(135deg, var(--warning), #f97316);
            color: white;
            padding: 8px 14px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35);
            font-variant-numeric: tabular-nums;
        }

        .timer.low {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            animation: pulse 1s ease infinite;
        }

        .question-text {
            font-size: 1.15rem;
            color: var(--text-mid);
            margin-bottom: 18px;
            text-align: center;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        /* Math expression — styled like a chalkboard card */
        .math-expression {
            background:
                radial-gradient(ellipse at top, rgba(255,255,255,0.5), transparent 70%),
                linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fef3c7;
            padding: 26px 20px;
            border-radius: var(--radius);
            margin: 14px 0 22px;
            font-size: 1.9rem;
            text-align: center;
            font-weight: 700;
            font-family: 'Georgia', 'Cambria', 'Times New Roman', serif;
            letter-spacing: 0.01em;
            border: 1px solid rgba(251, 191, 36, 0.25);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.08),
                0 10px 24px -8px rgba(15, 23, 42, 0.4);
            text-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
            position: relative;
            overflow: hidden;
        }

        .math-expression::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg, transparent 0, transparent 28px, rgba(255,255,255,0.02) 28px, rgba(255,255,255,0.02) 29px);
            pointer-events: none;
        }

        .math-expression .sqrt-symbol {
            color: #fbbf24;
        }

        /* Answer Options */
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .option-btn {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px 14px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(.2,.9,.3,1);
            color: var(--text-dark);
            min-height: 52px;
            font-family: 'Georgia', 'Cambria', serif;
            letter-spacing: 0.01em;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px -6px rgba(91, 75, 255, 0.35);
            background: var(--primary-soft);
        }

        .option-btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 2px;
        }

        .option-btn.selected {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 6px 16px -4px rgba(91, 75, 255, 0.5);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-color: var(--success);
            animation: popCorrect 0.5s cubic-bezier(.2,.9,.3,1.3);
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.5);
        }

        .option-btn.incorrect {
            background: linear-gradient(135deg, var(--danger), #dc2626);
            color: white;
            border-color: var(--danger);
            animation: shake 0.45s ease;
            box-shadow: 0 8px 20px -4px rgba(239, 68, 68, 0.45);
        }

        .option-btn:disabled {
            cursor: default;
        }

        /* Feedback */
        .feedback {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            text-align: center;
            font-weight: 600;
            animation: fadeIn 0.3s ease;
            font-size: 0.98rem;
        }

        .feedback.correct {
            background: var(--success-soft);
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback.incorrect {
            background: var(--danger-soft);
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Buttons */
        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            padding: 15px 28px;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(.2,.9,.3,1);
            min-height: 50px;
            box-shadow: 0 8px 20px -6px rgba(91, 75, 255, 0.5);
            letter-spacing: -0.01em;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -8px rgba(91, 75, 255, 0.55);
        }

        .btn:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: linear-gradient(135deg, var(--success), #059669);
            box-shadow: 0 8px 20px -6px rgba(16, 185, 129, 0.5);
        }

        .btn-success:hover {
            box-shadow: 0 14px 28px -8px rgba(16, 185, 129, 0.55);
        }

        .btn-center {
            display: block;
            margin: 22px auto 0;
        }

        /* Final Screen */
        .final-screen {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .final-screen h2 {
            font-size: 1.9rem;
            color: var(--text-dark);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            font-weight: 800;
        }

        .final-screen .final-message {
            color: var(--text-light);
            margin-bottom: 22px;
            font-size: 1rem;
        }

        .score-display {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 28px 20px;
            border-radius: var(--radius);
            margin: 18px 0;
            box-shadow: 0 20px 40px -12px rgba(91, 75, 255, 0.45);
            position: relative;
            overflow: hidden;
        }

        .score-display::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(400px 200px at 80% 0%, rgba(255,255,255,0.2), transparent 60%);
            pointer-events: none;
        }

        .score-display .score-label {
            font-size: 0.92rem;
            opacity: 0.92;
            font-weight: 500;
            position: relative;
        }

        .score-display .score-number {
            font-size: 2.8rem;
            font-weight: 800;
            margin: 6px 0;
            letter-spacing: -0.03em;
            font-family: 'Georgia', serif;
            position: relative;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);
        }

        .score-display .score-percent {
            font-size: 1.05rem;
            font-weight: 700;
            position: relative;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 18px 0;
        }

        .stat-card {
            background: var(--bg);
            padding: 18px 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .stat-card .stat-value {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.02em;
            font-family: 'Georgia', serif;
        }

        .stat-card .stat-label {
            font-size: 0.78rem;
            color: var(--text-light);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .medal {
            font-size: 4rem;
            margin: 10px 0 4px;
            animation: bounce 1.4s ease infinite;
            display: inline-block;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        @keyframes popCorrect {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(-4deg); }
            50% { transform: translateY(-10px) rotate(4deg); }
        }

        /* Responsive */
        @media (max-width: 520px) {
            body { padding: 8px; }
            #app { border-radius: 22px; min-height: auto; }
            .game-header { padding: 18px 18px 16px; }
            .game-header h1 { font-size: 1.35rem; }
            .game-content { padding: 20px 16px; }
            .question-text { font-size: 1.02rem; }
            .math-expression { font-size: 1.45rem; padding: 22px 14px; }
            .options-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .option-btn { padding: 14px 10px; font-size: 1.02rem; }
            .info-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
            .stat-card .stat-value { font-size: 1.3rem; }
            .score-display .score-number { font-size: 2.2rem; }
            .start-screen h2 { font-size: 1.4rem; }
        }

        @media (max-width: 360px) {
            .options-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main id="app" role="main" aria-label="Игра-тренажёр по действиям с корнями"></main>

    <script>
        // ============ CONSTANTS ============
        // База заданий. Уровень 1 — базовые корни из таблицы квадратов (перемешаны).
        // Далее — упрощение, сложение/вычитание, умножение, деление, степени, комбо, босс.
        const QUESTIONS = [
            // Уровень 1: базовые корни (перемешаны, разные значения таблицы квадратов)
            { id: 1,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√121', options: ['9', '10', '11', '12'], correct: 2, points: 10 },
            { id: 2,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√4',   options: ['1', '2', '3', '4'],   correct: 1, points: 10 },
            { id: 3,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√81',  options: ['7', '8', '9', '10'],  correct: 2, points: 10 },
            { id: 4,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√16',  options: ['3', '4', '5', '6'],   correct: 1, points: 10 },
            { id: 5,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√100', options: ['8', '9', '10', '11'], correct: 2, points: 10 },
            { id: 6,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√9',   options: ['2', '3', '4', '5'],   correct: 1, points: 10 },
            { id: 7,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√144', options: ['10', '11', '12', '13'], correct: 2, points: 10 },
            { id: 8,  level: 1, type: 'choice', question: 'Вычислите:', expression: '√64',  options: ['6', '7', '8', '9'],   correct: 2, points: 10 },

            // Уровень 2: вынесение из-под корня
            { id: 9,  level: 2, type: 'choice', question: 'Упростите:', expression: '√12',  options: ['2√3', '3√2', '4√3', '6√2'], correct: 0, points: 15 },
            { id: 10, level: 2, type: 'choice', question: 'Упростите:', expression: '√18',  options: ['2√3', '3√2', '4√2', '9√2'], correct: 1, points: 15 },
            { id: 11, level: 2, type: 'choice', question: 'Упростите:', expression: '√50',  options: ['5√2', '2√5', '10√5', '25√2'], correct: 0, points: 15 },
            { id: 12, level: 2, type: 'choice', question: 'Упростите:', expression: '√27',  options: ['3√3', '9√3', '3√9', '27'], correct: 0, points: 15 },
            { id: 13, level: 2, type: 'choice', question: 'Упростите:', expression: '√48',  options: ['4√3', '3√4', '6√2', '8√3'], correct: 0, points: 15 },

            // Уровень 3: сложение и вычитание подобных корней
            { id: 14, level: 3, type: 'choice', question: 'Вычислите:', expression: '√8 + √2', options: ['√10', '3√2', '2√3', '4√2'], correct: 1, points: 20 },
            { id: 15, level: 3, type: 'choice', question: 'Вычислите:', expression: '√27 − √3', options: ['√24', '2√3', '3√3', '8√3'], correct: 1, points: 20 },
            { id: 16, level: 3, type: 'choice', question: 'Вычислите:', expression: '√18 + √8', options: ['√26', '5√2', '4√2', '3√6'], correct: 1, points: 20 },
            { id: 17, level: 3, type: 'choice', question: 'Вычислите:', expression: '√50 − √32', options: ['√18', '√2', '3√2', '2√2'], correct: 2, points: 20 },
            { id: 18, level: 3, type: 'choice', question: 'Вычислите:', expression: '3√5 + 2√5', options: ['5√5', '5√10', '6√5', '√25'], correct: 0, points: 20 },

            // Уровень 4: умножение корней
            { id: 19, level: 4, type: 'choice', question: 'Вычислите:', expression: '√2 · √8', options: ['√10', '4', '√16', '2√2'], correct: 1, points: 25 },
            { id: 20, level: 4, type: 'choice', question: 'Вычислите:', expression: '√3 · √12', options: ['6', '√15', '3√2', '√36'], correct: 0, points: 25 },
            { id: 21, level: 4, type: 'choice', question: 'Вычислите:', expression: '√5 · √20', options: ['10', '√25', '5√2', '√100'], correct: 0, points: 25 },
            { id: 22, level: 4, type: 'choice', question: 'Вычислите:', expression: '√7 · √7', options: ['7', '√14', '49', '√49'], correct: 0, points: 25 },

            // Уровень 5: деление корней
            { id: 23, level: 5, type: 'choice', question: 'Вычислите:', expression: '√18 / √2', options: ['√9', '3', '√16', '9'], correct: 1, points: 25 },
            { id: 24, level: 5, type: 'choice', question: 'Вычислите:', expression: '√50 / √5', options: ['√10', '10', '√45', '5'], correct: 0, points: 25 },
            { id: 25, level: 5, type: 'choice', question: 'Вычислите:', expression: '√72 / √8', options: ['√9', '3', '√64', '8'], correct: 1, points: 25 },
            { id: 26, level: 5, type: 'choice', question: 'Вычислите:', expression: '√48 / √3', options: ['√16', '4', '√45', '16'], correct: 1, points: 25 },

            // Уровень 6: степень корня
            { id: 27, level: 6, type: 'choice', question: 'Вычислите:', expression: '(√3)²', options: ['3', '√9', '9', '√6'], correct: 0, points: 20 },
            { id: 28, level: 6, type: 'choice', question: 'Вычислите:', expression: '(√7)²', options: ['√14', '7', '49', '√49'], correct: 1, points: 20 },
            { id: 29, level: 6, type: 'choice', question: 'Вычислите:', expression: '(2√5)²', options: ['10', '20', '4√5', '2√25'], correct: 1, points: 20 },

            // Уровень 7: комбинированные выражения
            { id: 30, level: 7, type: 'choice', question: 'Упростите:', expression: '√12 + √27 − √3', options: ['4√3', '3√3', '5√3', '√36'], correct: 0, points: 30 },
            { id: 31, level: 7, type: 'choice', question: 'Упростите:', expression: '√50 − √18 + √8', options: ['4√2', '3√2', '5√2', '√40'], correct: 0, points: 30 },
            { id: 32, level: 7, type: 'choice', question: 'Вычислите:', expression: '√(4·9) + √(25·16)', options: ['26', '46', '30', '50'], correct: 0, points: 30 },

            // Уровень 8: БОСС
            { id: 33, level: 8, type: 'choice', question: '🔥 ФИНАЛЬНЫЙ БОСС! Вычислите:', expression: '(√12 + √27) · √3 − (√50 − √8)²', options: ['1', '2', '3', '4'], correct: 0, points: 50 }
        ];

        // ============ STATE ============
        // Состояние игры — один объект, управляющий всем UI через render()
        const state = {
            screen: 'start',          // 'start' | 'game' | 'final'
            currentQuestion: 0,
            score: 0,
            correctAnswers: 0,
            wrongAnswers: 0,
            timeLeft: 30,
            timerId: null,
            selectedAnswer: null,
            answered: false,
            startTime: null
        };

        // ============ RENDER ============
        function render() {
            const app = document.getElementById('app');
            // Очищаем через textContent-безопасный способ — пересоздаём содержимое
            while (app.firstChild) app.removeChild(app.firstChild);

            if (state.screen === 'start') renderStartScreen(app);
            else if (state.screen === 'game') renderGameScreen(app);
            else if (state.screen === 'final') renderFinalScreen(app);
        }

        // Экран «Старт»
        function renderStartScreen(app) {
            const header = document.createElement('header');
            header.className = 'game-header';

            const h1 = document.createElement('h1');
            h1.textContent = '🎮 Мастер Корней';
            const sub = document.createElement('div');
            sub.className = 'subtitle';
            sub.textContent = 'Интерактивный тренажёр по арифметическому квадратному корню';
            header.appendChild(h1);
            header.appendChild(sub);
            app.appendChild(header);

            const content = document.createElement('div');
            content.className = 'game-content';

            const start = document.createElement('div');
            start.className = 'start-screen';

            const logo = document.createElement('div');
            logo.className = 'logo-mark';
            logo.setAttribute('aria-hidden', 'true');
            logo.textContent = '√';
            start.appendChild(logo);

            const h2 = document.createElement('h2');
            h2.textContent = 'Добро пожаловать в игру!';
            start.appendChild(h2);

            const lead = document.createElement('p');
            lead.className = 'lead';
            lead.textContent = 'Пройди все миссии и стань Мастером Корней! Тебя ждут задания на вычисление, упрощение и преобразование выражений с корнями.';
            start.appendChild(lead);

            const infoGrid = document.createElement('div');
            infoGrid.className = 'info-grid';
            const infoItems = [
                { icon: '📝', label: 'Заданий', value: QUESTIONS.length },
                { icon: '⏱️', label: 'На ответ', value: '30 сек' },
                { icon: '🏆', label: 'Макс. баллов', value: getMaxScore() }
            ];
            infoItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'info-card';
                const icon = document.createElement('div');
                icon.className = 'info-icon';
                icon.textContent = item.icon;
                const lbl = document.createElement('div');
                lbl.className = 'info-label';
                lbl.textContent = item.label;
                const val = document.createElement('div');
                val.className = 'info-value';
                val.textContent = item.value;
                card.appendChild(icon);
                card.appendChild(lbl);
                card.appendChild(val);
                infoGrid.appendChild(card);
            });
            start.appendChild(infoGrid);

            const missionList = document.createElement('div');
            missionList.className = 'mission-list';
            const mh = document.createElement('h3');
            mh.textContent = '📚 Тебя ждут миссии:';
            missionList.appendChild(mh);
            const ul = document.createElement('ul');
            [
                'Базовые корни из таблицы квадратов',
                'Вынесение множителя из-под корня',
                'Сложение и вычитание подобных корней',
                'Умножение и деление корней',
                'Возведение корня в степень',
                'Комбинированные выражения',
                'Финальный босс!'
            ].forEach(text => {
                const li = document.createElement('li');
                li.textContent = text;
                ul.appendChild(li);
            });
            missionList.appendChild(ul);
            start.appendChild(missionList);

            const btn = document.createElement('button');
            btn.className = 'btn btn-success btn-center';
            btn.textContent = '🚀 Начать игру';
            btn.setAttribute('aria-label', 'Начать игру');
            btn.addEventListener('click', startGame);
            start.appendChild(btn);

            content.appendChild(start);
            app.appendChild(content);
        }

        // Игровой экран — один вопрос
        function renderGameScreen(app) {
            const question = QUESTIONS[state.currentQuestion];
            const progress = (state.currentQuestion / QUESTIONS.length) * 100;

            const header = document.createElement('header');
            header.className = 'game-header';

            const h1 = document.createElement('h1');
            h1.textContent = '🎮 Мастер Корней';
            header.appendChild(h1);

            const progressContainer = document.createElement('div');
            progressContainer.className = 'progress-container';
            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            progressBar.style.width = progress + '%';
            progressBar.setAttribute('role', 'progressbar');
            progressBar.setAttribute('aria-valuenow', String(Math.round(progress)));
            progressBar.setAttribute('aria-valuemin', '0');
            progressBar.setAttribute('aria-valuemax', '100');
            progressContainer.appendChild(progressBar);
            header.appendChild(progressContainer);

            const statsBar = document.createElement('div');
            statsBar.className = 'stats-bar';
            const pillMission = document.createElement('span');
            pillMission.className = 'stat-pill';
            pillMission.textContent = `Миссия ${state.currentQuestion + 1} из ${QUESTIONS.length}`;
            const pillScore = document.createElement('span');
            pillScore.className = 'stat-pill';
            pillScore.textContent = `★ ${state.score}`;
            statsBar.appendChild(pillMission);
            statsBar.appendChild(pillScore);
            header.appendChild(statsBar);

            app.appendChild(header);

            const content = document.createElement('div');
            content.className = 'game-content';

            const card = document.createElement('div');
            card.className = 'question-card';

            // Шапка вопроса
            const qHeader = document.createElement('div');
            qHeader.className = 'question-header';

            const levelBadge = document.createElement('span');
            levelBadge.className = 'level-badge';
            levelBadge.textContent = question.level === 8 ? '🔥 БОСС' : `Уровень ${question.level}`;
            qHeader.appendChild(levelBadge);

            const pointsBadge = document.createElement('span');
            pointsBadge.className = 'points-badge';
            pointsBadge.textContent = `+${question.points}`;
            qHeader.appendChild(pointsBadge);

            const timer = document.createElement('div');
            timer.className = 'timer' + (state.timeLeft <= 5 && !state.answered ? ' low' : '');
            timer.setAttribute('aria-live', 'polite');
            const timerIcon = document.createElement('span');
            timerIcon.setAttribute('aria-hidden', 'true');
            timerIcon.textContent = '⏱️';
            const timerText = document.createElement('span');
            timerText.id = 'timer-display';
            timerText.textContent = state.timeLeft + 'с';
            timer.appendChild(timerIcon);
            timer.appendChild(timerText);
            qHeader.appendChild(timer);

            card.appendChild(qHeader);

            // Текст вопроса
            const qText = document.createElement('div');
            qText.className = 'question-text';
            qText.textContent = question.question;
            card.appendChild(qText);

            // Математическое выражение
            const mathExpr = document.createElement('div');
            mathExpr.className = 'math-expression';
            mathExpr.setAttribute('aria-label', 'Математическое выражение');
            // Подсветка знака корня
            mathExpr.innerHTML = question.expression.replace(/√/g, '<span class="sqrt-symbol">√</span>');
            card.appendChild(mathExpr);

            // Варианты ответов
            if (question.type === 'choice') {
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';
                optionsGrid.setAttribute('role', 'group');
                optionsGrid.setAttribute('aria-label', 'Варианты ответов');

                question.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.setAttribute('aria-label', `Вариант ${index + 1}: ${option}`);

                    if (state.answered) {
                        if (index === question.correct) btn.classList.add('correct');
                        else if (index === state.selectedAnswer && index !== question.correct) btn.classList.add('incorrect');
                        btn.disabled = true;
                    } else {
                        btn.addEventListener('click', () => selectAnswer(index));
                    }

                    optionsGrid.appendChild(btn);
                });

                card.appendChild(optionsGrid);
            }

            // Обратная связь
            if (state.answered) {
                const feedback = document.createElement('div');
                const isCorrect = state.selectedAnswer === question.correct;
                feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'incorrect');
                if (state.selectedAnswer === null) {
                    feedback.textContent = `⏰ Время вышло! Правильный ответ: ${question.options[question.correct]}`;
                } else if (isCorrect) {
                    feedback.textContent = `✅ Отлично! +${question.points} баллов`;
                } else {
                    feedback.textContent = `❌ Неверно. Правильный ответ: ${question.options[question.correct]}`;
                }
                card.appendChild(feedback);

                const nextBtn = document.createElement('button');
                nextBtn.className = 'btn btn-center';
                nextBtn.textContent = state.currentQuestion < QUESTIONS.length - 1 ? 'Следующая миссия →' : 'Показать результат →';
                nextBtn.setAttribute('aria-label', 'Перейти дальше');
                nextBtn.addEventListener('click', nextQuestion);
                card.appendChild(nextBtn);
            }

            content.appendChild(card);
            app.appendChild(content);
        }

        // Финальный экран
        function renderFinalScreen(app) {
            const totalTime = Math.round((Date.now() - state.startTime) / 1000);
            const minutes = Math.floor(totalTime / 60);
            const seconds = totalTime % 60;
            const percentage = Math.round((state.correctAnswers / QUESTIONS.length) * 100);

            let medal = '🥉';
            let message = 'Хорошее начало! Попробуй ещё раз — и покорится больше.';
            if (percentage >= 90) {
                medal = '🏆';
                message = 'Невероятно! Ты настоящий Мастер Корней!';
            } else if (percentage >= 70) {
                medal = '🥇';
                message = 'Отлично! Превосходный результат!';
            } else if (percentage >= 50) {
                medal = '🥈';
                message = 'Хорошо! Но есть куда расти.';
            }

            const header = document.createElement('header');
            header.className = 'game-header';
            const h1 = document.createElement('h1');
            h1.textContent = '🎮 Мастер Корней';
            header.appendChild(h1);
            const sub = document.createElement('div');
            sub.className = 'subtitle';
            sub.textContent = 'Игра завершена';
            header.appendChild(sub);
            app.appendChild(header);

            const content = document.createElement('div');
            content.className = 'game-content';

            const final = document.createElement('div');
            final.className = 'final-screen';

            const medalEl = document.createElement('div');
            medalEl.className = 'medal';
            medalEl.setAttribute('aria-hidden', 'true');
            medalEl.textContent = medal;
            final.appendChild(medalEl);

            const h2 = document.createElement('h2');
            h2.textContent = 'Миссия выполнена!';
            final.appendChild(h2);

            const msg = document.createElement('p');
            msg.className = 'final-message';
            msg.textContent = message;
            final.appendChild(msg);

            const scoreDisplay = document.createElement('div');
            scoreDisplay.className = 'score-display';
            const scoreLabel = document.createElement('div');
            scoreLabel.className = 'score-label';
            scoreLabel.textContent = 'Твой результат';
            const scoreNumber = document.createElement('div');
            scoreNumber.className = 'score-number';
            scoreNumber.textContent = `${state.score} / ${getMaxScore()}`;
            const scorePercent = document.createElement('div');
            scorePercent.className = 'score-percent';
            scorePercent.textContent = `${percentage}% правильных ответов`;
            scoreDisplay.appendChild(scoreLabel);
            scoreDisplay.appendChild(scoreNumber);
            scoreDisplay.appendChild(scorePercent);
            final.appendChild(scoreDisplay);

            const statsGrid = document.createElement('div');
            statsGrid.className = 'stats-grid';
            const stats = [
                { value: state.correctAnswers, label: 'Верно' },
                { value: state.wrongAnswers, label: 'Ошибок' },
                { value: `${minutes}:${String(seconds).padStart(2, '0')}`, label: 'Время' }
            ];
            stats.forEach(s => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                const val = document.createElement('div');
                val.className = 'stat-value';
                val.textContent = s.value;
                const lbl = document.createElement('div');
                lbl.className = 'stat-label';
                lbl.textContent = s.label;
                card.appendChild(val);
                card.appendChild(lbl);
                statsGrid.appendChild(card);
            });
            final.appendChild(statsGrid);

            const restartBtn = document.createElement('button');
            restartBtn.className = 'btn btn-success btn-center';
            restartBtn.textContent = '🔄 Играть снова';
            restartBtn.setAttribute('aria-label', 'Начать игру заново');
            restartBtn.addEventListener('click', restartGame);
            final.appendChild(restartBtn);

            content.appendChild(final);
            app.appendChild(content);
        }

        // ============ HELPERS ============
        function getMaxScore() {
            return QUESTIONS.reduce((sum, q) => sum + q.points, 0);
        }

        // ============ HANDLERS ============
        function startGame() {
            state.screen = 'game';
            state.currentQuestion = 0;
            state.score = 0;
            state.correctAnswers = 0;
            state.wrongAnswers = 0;
            state.startTime = Date.now();
            startTimer();
            render();
        }

        function startTimer() {
            state.timeLeft = 30;
            clearInterval(state.timerId);
            state.timerId = setInterval(() => {
                state.timeLeft--;
                const timerDisplay = document.getElementById('timer-display');
                if (timerDisplay) timerDisplay.textContent = state.timeLeft + 'с';

                // Подсветка таймера при малом времени
                const timerEl = timerDisplay && timerDisplay.parentElement;
                if (timerEl) {
                    if (state.timeLeft <= 5) timerEl.classList.add('low');
                    else timerEl.classList.remove('low');
                }

                if (state.timeLeft <= 0) {
                    clearInterval(state.timerId);
                    if (!state.answered) {
                        state.wrongAnswers++;
                        state.answered = true;
                        state.selectedAnswer = null;
                        render();
                    }
                }
            }, 1000);
        }

        function selectAnswer(index) {
            if (state.answered) return;
            state.selectedAnswer = index;
            state.answered = true;
            clearInterval(state.timerId);

            const question = QUESTIONS[state.currentQuestion];
            if (index === question.correct) {
                state.score += question.points;
                state.correctAnswers++;
            } else {
                state.wrongAnswers++;
            }
            render();
        }

        function nextQuestion() {
            state.currentQuestion++;
            state.selectedAnswer = null;
            state.answered = false;

            if (state.currentQuestion >= QUESTIONS.length) {
                state.screen = 'final';
            } else {
                startTimer();
            }
            render();
        }

        function restartGame() {
            clearInterval(state.timerId);
            state.screen = 'start';
            state.currentQuestion = 0;
            state.score = 0;
            state.correctAnswers = 0;
            state.wrongAnswers = 0;
            state.selectedAnswer = null;
            state.answered = false;
            render();
        }

        // ============ INIT ============
        render();
    </script>
</body>
</html>
